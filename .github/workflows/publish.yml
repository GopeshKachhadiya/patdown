name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:   # manual re-publish of the checked-out ref

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, used when PYPI_API_TOKEN is not set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If the PYPI_API_TOKEN secret is set, upload with it; if it is empty
          # or absent, the action falls back to trusted publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
